# This workflow does a clean install of each service's dependencies, builds the
# source code, and runs tests across different versions of node.
# The repo is a monorepo, so install/build/test run inside each service directory.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        service: [api-server, build-server, s3-reverse-proxy, frontend-nextjs]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.service }}/package-lock.json
    - name: Install dependencies
      working-directory: ${{ matrix.service }}
      run: npm ci
    - name: Build
      working-directory: ${{ matrix.service }}
      run: npm run build --if-present
    - name: Test
      working-directory: ${{ matrix.service }}
      run: npm test --if-present
